<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0A2016">
<title>CS Notes — a CS reference workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <a href="#content" class="skip-link">Skip to content</a>

  <!-- Top navbar -->
  <header class="navbar">
    <div class="navbar-brand" id="navbarBrand">
      <span class="brand-mark">&lt;/&gt;</span>
      <span class="brand-name">CS<strong>Notes</strong></span>
    </div>
    <div class="navbar-search">
      <input type="text" id="searchInput" placeholder="Search all sections, e.g. dynamic programming..." autocomplete="off">
      <span class="navbar-search-icon">&#8981;</span>
      <span class="navbar-search-kbd" id="searchKbd">Ctrl K</span>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="navbar-stat" id="navbarStat"></div>
    <button class="profile-chip" id="profileChipBtn" type="button"></button>
    <button class="study-btn" id="studyModeBtn" type="button" title="Quiz or flashcard yourself">
      <span class="study-btn-icon">&#9673;</span><span class="study-btn-label">Study</span>
    </button>
    <div class="winctrl-group">
      <button class="winctrl-btn" id="toggleSidebarBtn" type="button" title="Minimize sidebar" aria-label="Toggle sidebar">
        <span class="winctrl-icon" id="sidebarBtnIcon">&#8722;</span>
      </button>
      <button class="winctrl-btn" id="toggleChromeBtn" type="button" title="Minimize toolbar" aria-label="Toggle toolbar">
        <span class="winctrl-icon" id="chromeBtnIcon">&#8722;</span>
      </button>
    </div>
  </header>

  <!-- Toolbar stack: collapses as one unit (see the minimize button) -->
  <div class="chrome-stack" id="chromeStack">
    <div class="chrome-stack-inner">

      <!-- Section switcher -->
      <nav class="sectionbar" id="sectionBar" aria-label="Sections"></nav>

      <!-- Subfield quick-jump strip -->
      <nav class="pillstrip" id="pillStrip" aria-label="Subfields"></nav>

      <!-- Breadcrumb -->
      <div class="breadcrumb">
        <span class="bc-root" id="bcHome">cs-notes</span>
        <span class="bc-path" id="bcPath"></span>
      </div>

    </div>
  </div>

  <!-- Phones: dims the page behind the open menu; tap it to close -->
  <div class="drawer-scrim" id="drawerScrim"></div>

  <div class="layout">

    <!-- Sidebar: directory tree -->
    <nav class="sidebar" id="sidebar">
      <div class="sidebar-tree" id="sidebarTree"></div>
    </nav>

    <!-- Main content -->
    <main class="content" id="content" tabindex="-1">
      <!-- populated by app.js -->
    </main>

  </div>

  <!-- Study mode overlay: quiz + flashcards -->
  <div class="study-overlay" id="studyOverlay" aria-hidden="true">
    <div class="study-panel" id="studyPanel" role="dialog" aria-modal="true" aria-labelledby="studyTitle"></div>
  </div>

  <!-- Profile switcher overlay -->
  <div class="study-overlay" id="profileOverlay" aria-hidden="true">
    <div class="study-panel" id="profilePanel" role="dialog" aria-modal="true" aria-labelledby="profileTitle"></div>
  </div>

  <!-- Complaint box: floating button + dialog -->
  <button class="fb-fab" id="feedbackBtn" type="button" aria-haspopup="dialog" title="Report a problem or suggest an improvement">
    <span class="fb-fab-icon" aria-hidden="true">!</span>
    <span class="fb-fab-label">Complaint box</span>
  </button>

  <div class="study-overlay" id="feedbackOverlay" aria-hidden="true">
    <div class="study-panel feedback-panel" id="feedbackPanel" role="dialog" aria-modal="true" aria-labelledby="feedbackTitle"></div>
  </div>

  <!-- Image lightbox overlay -->
  <div class="study-overlay" id="imageOverlay" aria-hidden="true">
    <div class="study-panel image-lightbox-panel" id="imagePanel" role="dialog" aria-modal="true" aria-labelledby="imageLightboxTitle"></div>
  </div>

  <script src="data-reference.js"></script>
  <script src="data-grade11.js"></script>
  <script src="data-grade12.js"></script>
  <script src="questions-grade11.js"></script>
  <script src="questions-grade12.js"></script>
  <script src="app.js"></script>
  <script src="feedback.js"></script>
  <script src="cloud-config.js"></script>
  <script src="cloud.js"></script>
</body>
</html>
